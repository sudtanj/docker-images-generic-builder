services:
  mini-router:
    # Pulls the published image from Docker Hub instead of building locally.
    # Pin an exact version instead of :latest if you want reproducible pulls
    # (see https://hub.docker.com/r/sudtanj/mini-router/tags).
    image: sudtanj/mini-router:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MINI_ROUTER_POOL_FAST: openai:gpt-4o-mini,anthropic:claude-haiku-4-5
      MINI_ROUTER_POOL_SMART: anthropic:claude-sonnet-4-5,openai:gpt-4o
      MINI_ROUTER_ALIASES: gpt-3.5-turbo=fast,gpt-4o-mini=fast
      MINI_ROUTER_REQUIRE_AUTH: "true"
      # MINI_ROUTER_ADMIN: "false"
      # MINI_ROUTER_METRICS: "false"
      MINI_ROUTER_LOG: info

    deploy:
      resources:
        limits:
          memory: 64M

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
